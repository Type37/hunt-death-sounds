<!doctype html>
<html>

<style>

html { font: clamp(30px, 9vw, 48px) "Ivy Text", serif; }

input[type=checkbox] { width: 1em; height: 1em; }

.overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.35); }

function chips(id, values, initial) {

for (const id of Object.values(vol)) {
  const r = document.getElementById(id), o = document.getElementById(id + "Out");
  r.oninput = () => { o.textContent = r.value + "%"; };
}
const level = cat => Number(document.getElementById(vol[cat]).value) / 100;
const gainOf = (path, cat) => Math.pow(10, (GAIN_DB[path] ?? 0) / 20) * (cat ? level(cat) : 1);
const ctx = new AudioContext();
const cache = {};
const load = path => cache[path] ??= fetch(encodeURI(path) + ".wav").then(r => r.arrayBuffer()).then(b => ctx.decodeAudioData(b));

function stopAll() { sources.forEach(s => { try { s.stop(); } catch (e) {} }); sources = []; }
function play(parts, t0) {
  for (const p of parts) {
    const src = ctx.createBufferSource(), g = ctx.createGain();
    src.buffer = p.buf; g.gain.value = p.gain; src.connect(g).connect(ctx.destination);
    src.start(t0 + p.time); sources.push(src);
  }
}
let last = null;
async function die(k) {
  stopAll(); ctx.resume();
  const v = voice[k], K = k.toUpperCase();
  const t = timelines[choose("dir", Object.keys(timelines))];
  const list = [];   // [time or null (after scream), path, category]
  list.push([0, v.dir + chooseClip("scream" + K, v.scream), "voice"]);
  const exhalePath = v.dir + chooseClip("exhale" + K, v.exhale);
  const name = [k === "m" ? "male" : "female"];
  if (document.getElementById("useClothes").checked) {
    const w = choose("rustle", ["light", "medium", "heavy"]);
    name.push(w);
    for (const p of ["fabric", "leather", "jingle"]) list.push([t.move * CLIP, layerPath("old_c_player_fol_" + w + "_" + p), "clothes"]);
    for (const p of ["metal", "base_new", "leather"]) list.push([t.heavy * CLIP, layerPath("c_player_fol_heavy_" + p), "clothes"]);
  }
  if (document.getElementById("useGround").checked) {
    const g = choose("ground", Object.keys(grounds));
    name.push(g);
    const [bf, land] = grounds[g];
    list.push([t.bodyfall * CLIP, BF + pick(bf), "ground"]);
    for (const tl of t.land) {
      list.push([tl * CLIP, layerPath(land), "ground"]);
      if (g !== "water") list.push([tl * CLIP, layerPath("c_player_fts_land_boot"), "ground"]);

function wav(buf) {
  const ch = buf.numberOfChannels, n = buf.length, sr = buf.sampleRate;
  const out = new DataView(new ArrayBuffer(44 + n * ch * 2));
  const s = (o, t) => [...t].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  s(0, "RIFF"); out.setUint32(4, 36 + n * ch * 2, true); s(8, "WAVEfmt ");
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, ch, true);
  out.setUint32(24, sr, true); out.setUint32(28, sr * ch * 2, true); out.setUint16(32, ch * 2, true);
  out.setUint16(34, 16, true); s(36, "data"); out.setUint32(40, n * ch * 2, true);
  const data = [...Array(ch).keys()].map(c => buf.getChannelData(c));

  for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++) {

  }

}
document.getElementById("download").onclick = async () => {
  if (!last) return;
  const sr = 48000;
  const len = Math.max(...last.parts.map(p => p.time + p.buf.duration)) + 0.1;
  const off = new OfflineAudioContext(2, Math.ceil(len * sr), sr);
  for (const p of last.parts) {
    const src = off.createBufferSource(), g = off.createGain();
    src.buffer = p.buf; g.gain.value = p.gain; src.connect(g).connect(off.destination); src.start(p.time);
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(wav(await off.startRendering()));
  a.download = last.name + ".wav";
  a.click();
};
