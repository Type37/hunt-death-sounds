<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIE</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
@font-face { font-family: "Ivy Text"; src: local("IvyPresto Text Regular"), local("IvyPresto Text"), local("IvyPresto-Text-Regular"); }
html { font: clamp(30px, 9vw, 48px) "Ivy Text", serif; }
body { margin: 0; padding: 16px; box-sizing: border-box; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.4em; }
.row { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0.25em; max-width: 100%; }
button, input, label, select { font: inherit; }
.opt { font-size: clamp(17px, 4.6vw, 24px); }
.ui { font-size: clamp(15px, 4vw, 22px); }
.chips button[aria-pressed="true"] { outline: 2px solid; }
.chips.off button { opacity: 0.35; }
input[type=checkbox] { width: 1em; height: 1em; }
.overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.35); }
.overlay.open { display: flex; }
.overlay > div { background: Canvas; color: CanvasText; padding: 0.8em; display: flex; flex-direction: column; gap: 0.5em; font-size: clamp(16px, 4.4vw, 22px); max-width: calc(100vw - 32px); max-height: calc(100svh - 32px); overflow: auto; box-sizing: border-box; }
#adv .label { min-width: 6em; text-align: right; }
@media (max-width: 600px) { #adv .label { min-width: 0; width: 100%; text-align: center; } }
button { touch-action: manipulation; }
</style>
</head>
<body>
<div class="row">
<button id="m">DIE ♂️</button>
<button id="f">DIE ♀️</button>
</div>
<div class="row opt">
<label><input type="checkbox" id="useGround" checked> ground</label>
<span class="row chips" id="ground"></span>
</div>
<div class="row opt">
<label><input type="checkbox" id="useClothes" checked> clothes</label>
<span class="row chips" id="rustle"></span>
</div>
<div class="row opt">
<button id="download" disabled>download</button>
<button id="advBtn">advanced</button>
</div>
<div class="row ui">
<button data-ui="ui_hud_player_dead_plr_01">YOU DIED</button>
<button data-ui="ui_hud_player_dead_tm_01">TEAMMATE DIED</button>
<button data-ui="ui_hud_player_dead_loop">STARE AT DEATH</button>
<button data-ui="ui_menu_hunter_dead">THAT HUNTER IS GONE</button>
</div>
<div id="moreGround" class="overlay"><div><div class="row chips" id="groundMore"></div></div></div>
<div id="adv" class="overlay"><div>
<div class="row"><span class="label">scream ♂️</span><span class="row chips" id="screamM"></span></div>
<div class="row"><span class="label">exhale ♂️</span><span class="row chips" id="exhaleM"></span></div>
<div class="row"><span class="label">scream ♀️</span><span class="row chips" id="screamF"></span></div>
<div class="row"><span class="label">exhale ♀️</span><span class="row chips" id="exhaleF"></span></div>
<div class="row"><span class="label">fall</span><span class="row chips" id="dir"></span></div>
<div class="row"><button id="advClose">close</button></div>
</div></div>

    const w = choose("rustle", ["light", "medium", "heavy"]);
    name.push(w);
    for (const p of ["fabric", "leather", "jingle"]) plan.push([t.move * CLIP, layer("old_c_player_fol_" + w + "_" + p)]);
    for (const p of ["metal", "base_new", "leather"]) plan.push([t.heavy * CLIP, layer("c_player_fol_heavy_" + p)]);
  }
  if (document.getElementById("useGround").checked) {
    const g = choose("ground", Object.keys(grounds));
    name.push(g);
    const [bf, land] = grounds[g];
    plan.push([t.bodyfall * CLIP, clip(BF + pick(bf))]);
    for (const tl of t.land) {
      plan.push([tl * CLIP, layer(land)]);
      if (g !== "water") plan.push([tl * CLIP, layer("c_player_fts_land_boot")]);
    }
  }
  await Promise.all([exhale, ...plan.map(p => p[1])].map(ready));
  plan.push([scream.duration + SEQ_DELAY, exhale]);
  playing = plan.map(p => p[1]);
  for (const [time, a] of plan) {
    if (time === 0) a.play(); else timers.push(setTimeout(() => a.play(), time * 1000));
  }
  last = { name: "hunt death " + name.join(" "), parts: plan.map(([time, a]) => [time, a.src]) };
  document.getElementById("download").disabled = false;
}
function wav(buf) {
  const ch = buf.numberOfChannels, n = buf.length, sr = buf.sampleRate;
  const out = new DataView(new ArrayBuffer(44 + n * ch * 2));
  const s = (o, t) => [...t].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  s(0, "RIFF"); out.setUint32(4, 36 + n * ch * 2, true); s(8, "WAVEfmt ");
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, ch, true);
  out.setUint32(24, sr, true); out.setUint32(28, sr * ch * 2, true); out.setUint16(32, ch * 2, true);
  out.setUint16(34, 16, true); s(36, "data"); out.setUint32(40, n * ch * 2, true);
  const data = [...Array(ch).keys()].map(c => buf.getChannelData(c));
  let o = 44;
  for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++) {
    const x = Math.max(-1, Math.min(1, data[c][i])); out.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7fff, true); o += 2;
  }
  return new Blob([out], { type: "audio/wav" });
}
document.getElementById("download").onclick = async () => {
  if (!last) return;
  const sr = 48000, tmp = new OfflineAudioContext(2, 1, sr);
  const bufs = await Promise.all(last.parts.map(([, url]) => fetch(url).then(r => r.arrayBuffer()).then(b => tmp.decodeAudioData(b))));
  const len = Math.max(...last.parts.map(([t], i) => t + bufs[i].duration)) + 0.1;
  const ctx = new OfflineAudioContext(2, Math.ceil(len * sr), sr);
  last.parts.forEach(([t], i) => { const src = ctx.createBufferSource(); src.buffer = bufs[i]; src.connect(ctx.destination); src.start(t); });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(wav(await ctx.startRendering()));
  a.download = last.name + ".wav";
  a.click();
};
document.getElementById("m").onclick = () => die("m");
document.getElementById("f").onclick = () => die("f");
document.querySelectorAll("[data-ui]").forEach(b => b.onclick = () => {
  stopAll();
  const a = clip("UI death/" + b.dataset.ui);
  playing = [a]; a.play();
});
