  "dir:back": "gear hit at 1.11s, thumps at 0.72s",
  "dir:left": "gear hit at 0.65s",
  "dir:right": "gear hit at 0.65s",
  dist: "gear silent past 20m",
  volVoice: "scream 0db, exhale -9db",
  volClothes: "100 = game mix",
  volGround: "100 = game mix",
  useMenu: "-2db, enemies get none",
  headshot: "no scream"
};
function applyTips() {
  for (const [k, t] of Object.entries(TIPS)) {
    if (k.includes(":")) {
      const [box, val] = k.split(":");
      const sel = box === "ground" ? "#ground button, #groundMore button" : "#" + box + " button";
      document.querySelectorAll(sel).forEach(b => { if (b.textContent === val) b.title = t; });
    } else if (k === "random") {
      document.querySelectorAll(".chips button").forEach(b => { if (b.textContent === "random") b.title = t; });
    } else {
      const el = document.getElementById(k); if (!el) continue;
      (el.closest("label") || el).title = t; el.title = t;
    }
  }
}
applyTips();
// the HUD checkbox names the sound for the chosen person
const menuName = document.getElementById("menuName");
const syncMenu = () => { menuName.textContent = state.actor === "you" ? "you died sfx" : "teammate death sfx"; };
document.querySelectorAll("#actor button").forEach(b => b.addEventListener("click", syncMenu));
syncMenu();
const ctx = new AudioContext();
const cache = {};
const load = path => cache[path] ??= fetch(encodeURI(path) + ".wav").then(r => r.arrayBuffer()).then(b => ctx.decodeAudioData(b));
let sources = [];
function stopAll() { sources.forEach(s => { try { s.stop(); } catch (e) {} }); sources = []; }
function play(parts, t0) {
  for (const p of parts) {
    const src = ctx.createBufferSource(), g = ctx.createGain();
    src.buffer = p.buf; g.gain.value = p.gain; src.connect(g).connect(ctx.destination);
    src.start(t0 + p.time); sources.push(src);
  }
}
let last = null;
async function die(k) {
  stopAll(); ctx.resume();
  const g = k === "m" ? "male_a" : "female_a", K = k.toUpperCase();
  const actor = ACTORS[state.actor];
  const dirName = choose("dir", Object.keys(ANIM)), a = ANIM[dirName];
  const len = actor === "player" ? a.len1 : a.len3;
  const list = [];   // [time, file, dB, category]
  const voice = EV.voice[g][actor].flat();
  const pickVoice = (kind, id) => {
    const opts = voice.filter(c => c[0].includes(kind));
    const want = state[id];
    return (want !== "random" && opts.find(c => numOf(c[0]) === want)) || pick(opts);
  };
  // headshot: the game's headshot event only stops the hunter's voice, so no scream or exhale
  const headshot = document.getElementById("headshot").checked;
  const scream = pickVoice("scream", "scream" + K), exhale = pickVoice("exhale", "exhale" + K);
  if (!headshot) list.push([0, ...scream, "voice"]);
  const name = [k === "m" ? "male" : "female", state.actor];
  if (headshot) name.push("headshot");
  if (document.getElementById("useClothes").checked) {
    const sp = choose("speed", ["sneak", "walk", "run"]);
    name.push(sp);
    for (const layer of EV.move[actor][sp]) list.push([a.move * len, ...pick(layer), "clothes"]);
    for (const layer of EV.heavy[actor]) list.push([a.heavy * len, ...pick(layer), "clothes"]);
  }
  if (document.getElementById("useGround").checked) {
    const gr = choose("ground", GROUNDS);
    name.push(gr);
    for (const layer of EV.bodyfall[gr][actor]) list.push([a.bodyfall * len, ...pick(layer), "ground"]);
    for (const tl of a.land) for (const layer of EV.land[gr][actor]) list.push([tl * len, ...pick(layer), "ground"]);
  }
  if (document.getElementById("useMenu").checked && HUD[actor]) list.push([0, ...HUD[actor], 0, null]);
  const bufs = await Promise.all([...list.map(x => load(x[1])), load(exhale[0])]);
  const dist = actor === "player" ? 0 : Number(distEl.value);
  const gain = (db, att, cat) => Math.pow(10, db / 20) * (cat ? level(cat) * falloff(att, dist) : 1);
  const parts = list.map((x, i) => ({ time: x[0], buf: bufs[i], gain: gain(x[2], x[3], x[4]) }));
  if (!headshot) parts.push({ time: bufs[0].duration + SEQ_DELAY, buf: bufs[bufs.length - 1], gain: gain(exhale[1], exhale[2], "voice") });
  play(parts, ctx.currentTime + 0.05);
  last = { name: "hunt death " + name.join(" "), parts };
  document.getElementById("download").disabled = false;
}
function wav(buf) {
  const ch = buf.numberOfChannels, n = buf.length, sr = buf.sampleRate;
  const out = new DataView(new ArrayBuffer(44 + n * ch * 2));
  const s = (o, t) => [...t].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  s(0, "RIFF"); out.setUint32(4, 36 + n * ch * 2, true); s(8, "WAVEfmt ");
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, ch, true);
  out.setUint32(24, sr, true); out.setUint32(28, sr * ch * 2, true); out.setUint16(32, ch * 2, true);
  out.setUint16(34, 16, true); s(36, "data"); out.setUint32(40, n * ch * 2, true);
  const data = [...Array(ch).keys()].map(c => buf.getChannelData(c));
  let o = 44;
  for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++) {
    const x = Math.max(-1, Math.min(1, data[c][i])); out.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7fff, true); o += 2;
  }
  return new Blob([out], { type: "audio/wav" });
}
document.getElementById("download").onclick = async () => {
  if (!last) return;
  const sr = 48000;
  const len = Math.max(...last.parts.map(p => p.time + p.buf.duration)) + 0.1;
  const off = new OfflineAudioContext(2, Math.ceil(len * sr), sr);
  for (const p of last.parts) {
    const src = off.createBufferSource(), g = off.createGain();
    src.buffer = p.buf; g.gain.value = p.gain; src.connect(g).connect(off.destination); src.start(p.time);
  }
  const el = document.createElement("a");
  el.href = URL.createObjectURL(wav(await off.startRendering()));
  el.download = last.name + ".wav";
  el.click();
};
document.getElementById("m").onclick = () => die("m");
document.getElementById("f").onclick = () => die("f");
document.querySelectorAll("[data-ui]").forEach(b => b.onclick = async () => {
  stopAll(); ctx.resume();
  play([{ time: 0, buf: await load("UI death/" + b.dataset.ui), gain: 1 }], ctx.currentTime + 0.05);
});
</script>
